<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice — NPTEL MCQ Quizzy</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="questions-data.js"></script>
<style>
  :root {
    --pink: #ff6b9d;
    --pink-soft: #ffd6e4;
    --pink-light: #fff0f5;
    --purple: #8b5cf6;
    --purple-soft: #e9e1ff;
    --green: #22c07a;
    --green-light: #dcfcec;
    --red: #f0446a;
    --red-light: #ffe3ea;
    --ink: #3d2c4f;
    --white: #ffffff;
    --radius: 26px;
    --shadow: 0 10px 30px rgba(255, 107, 157, 0.18);
    --shadow-lg: 0 18px 45px rgba(139, 92, 246, 0.20);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #fff5f9 0%, #ffffff 45%, #f6f1ff 100%);
    min-height: 100vh;
  }

  h1, h2, h3, .logo, .btn, .big-score { font-family: 'Baloo 2', cursive; }

  /* ---------- NAV ---------- */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 6vw;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(255, 107, 157, 0.10);
  }
  .logo {
    font-size: 1.5rem; font-weight: 800; color: var(--pink);
    display: flex; align-items: center; gap: 8px; text-decoration: none;
  }
  .logo-bubble {
    width: 38px; height: 38px; border-radius: 14px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1.1rem; box-shadow: var(--shadow);
    transform: rotate(-6deg);
  }
  nav ul { display: flex; gap: 28px; list-style: none; }
  nav ul a {
    text-decoration: none; color: var(--ink); font-weight: 700; font-size: 1rem;
    padding: 8px 14px; border-radius: 999px; transition: all .2s ease;
  }
  nav ul a:hover { background: var(--pink-light); color: var(--pink); }
  nav ul a.active { background: var(--pink); color: #fff; box-shadow: var(--shadow); }

  main { max-width: 760px; margin: 0 auto; padding: 40px 5vw 80px; }

  .hidden { display: none !important; }

  /* ---------- PICKER (no week in URL) ---------- */
  .panel {
    background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 40px 34px; text-align: center;
  }
  .panel h2 { font-size: 1.8rem; margin-bottom: 8px; }
  .panel p { color: #8a7a9b; font-weight: 600; margin-bottom: 26px; }
  .week-pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; }
  .week-pick {
    background: var(--pink-light); border: 3px solid transparent; border-radius: 18px;
    padding: 14px 6px; font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 1.05rem;
    color: var(--ink); cursor: pointer; transition: all .18s ease;
  }
  .week-pick:hover { background: var(--pink); color: #fff; transform: translateY(-3px); box-shadow: var(--shadow); }

  /* ---------- QUIZ TOP BAR ---------- */
  .quiz-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; font-weight: 800;
  }
  .quiz-top .q-count { color: var(--purple); }
  .score-pill {
    background: var(--white); border-radius: 999px; padding: 8px 20px;
    box-shadow: var(--shadow); color: var(--pink); font-family: 'Baloo 2', cursive; font-size: 1.05rem;
  }

  /* ---------- PROGRESS BAR ---------- */
  .progress-wrap {
    background: var(--white); border-radius: 999px; height: 16px;
    box-shadow: inset 0 2px 6px rgba(61,44,79,.12); margin-bottom: 26px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    transition: width .35s ease;
  }

  /* ---------- QUESTION CARD ---------- */
  .q-card {
    background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 34px 30px;
  }
  .q-week-tag {
    display: inline-block; background: var(--purple-soft); color: var(--purple);
    font-weight: 800; font-size: .8rem; text-transform: uppercase; letter-spacing: 1px;
    padding: 5px 14px; border-radius: 999px; margin-bottom: 16px;
  }
  .q-text { font-size: 1.25rem; font-weight: 800; line-height: 1.45; margin-bottom: 24px; }

  .options { display: flex; flex-direction: column; gap: 14px; }
  .option {
    display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
    background: #fdf9ff; border: 3px solid var(--purple-soft); border-radius: 18px;
    padding: 15px 18px; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 700;
    color: var(--ink); cursor: pointer; transition: all .16s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--pink); background: var(--pink-light); transform: translateX(4px); }
  .option:disabled { cursor: default; }
  .opt-letter {
    flex: 0 0 34px; height: 34px; border-radius: 12px;
    background: var(--purple-soft); color: var(--purple);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', cursive; font-weight: 800;
  }
  .option.correct { border-color: var(--green); background: var(--green-light); }
  .option.correct .opt-letter { background: var(--green); color: #fff; }
  .option.wrong { border-color: var(--red); background: var(--red-light); }
  .option.wrong .opt-letter { background: var(--red); color: #fff; }
  .option.dim { opacity: .55; }

  /* ---------- EXPLANATION ---------- */
  .explain {
    margin-top: 22px; background: #fff8e6; border: 3px solid #ffe3a3; border-radius: 18px;
    padding: 18px 20px; font-weight: 600; color: #7a6218; line-height: 1.55;
    animation: pop .25s ease;
  }
  .explain strong { color: #b98a00; }

  .next-row { margin-top: 24px; text-align: right; }
  .btn {
    display: inline-block; text-decoration: none; font-weight: 700; font-size: 1.05rem;
    padding: 14px 34px; border-radius: 999px; border: none; cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .btn:hover { transform: translateY(-3px) scale(1.03); }
  .btn-pink { background: linear-gradient(135deg, var(--pink), #ff8fb8); color: #fff; box-shadow: var(--shadow-lg); }
  .btn-outline { background: var(--white); color: var(--purple); box-shadow: 0 8px 24px rgba(139,92,246,.15); border: 3px solid var(--purple-soft); }

  /* ---------- RESULTS ---------- */
  .result-emoji { font-size: 3.4rem; margin-bottom: 8px; }
  .big-score { font-size: 3.2rem; font-weight: 800; color: var(--pink); }
  .result-msg { color: #8a7a9b; font-weight: 700; margin: 6px 0 24px; }
  .result-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 34px; }

  .review h3 { font-size: 1.4rem; margin-bottom: 16px; text-align: center; }
  .review-item {
    background: var(--white); border-radius: 20px; box-shadow: var(--shadow);
    padding: 22px 24px; margin-bottom: 16px; border-left: 8px solid var(--red);
  }
  .review-item .rv-q { font-weight: 800; margin-bottom: 10px; }
  .review-item .rv-line { font-weight: 700; margin: 3px 0; }
  .rv-wrong { color: var(--red); }
  .rv-right { color: var(--green); }
  .review-empty { text-align: center; color: var(--green); font-weight: 800; font-size: 1.15rem; padding: 16px; }

  /* ---------- LOADING / ERROR ---------- */
  .center-msg { text-align: center; padding: 60px 20px; font-weight: 700; color: #8a7a9b; }
  .spinner {
    width: 46px; height: 46px; margin: 0 auto 18px; border-radius: 50%;
    border: 5px solid var(--pink-soft); border-top-color: var(--pink);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  @media (max-width: 640px) {
    nav ul { gap: 6px; }
    nav ul a { padding: 6px 10px; font-size: .9rem; }
    .q-card { padding: 26px 20px; }
  }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html"><span class="logo-bubble">?</span>Quizzy</a>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="index.html#weeks" class="active">Practice</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="progress.html">My Progress</a></li>
  </ul>
</nav>

<main>

  <!-- Loading -->
  <div id="loading" class="center-msg">
    <div class="spinner"></div>
    Loading questions…
  </div>

  <!-- Error -->
  <div id="error" class="center-msg hidden">
    <p id="errorMsg" style="margin-bottom:20px;">Something went wrong.</p>
    <a class="btn btn-pink" href="index.html">Back to Home</a>
  </div>

  <!-- Week picker (shown if no ?week=N in URL) -->
  <div id="picker" class="panel hidden">
    <h2>Pick a Week 🎯</h2>
    <p>Which week's questions would you like to practise?</p>
    <div class="week-pick-grid" id="weekPickGrid"></div>
  </div>

  <!-- Quiz -->
  <div id="quiz" class="hidden">
    <div class="quiz-top">
      <span class="q-count" id="qCount">Question 1 of 10</span>
      <span class="score-pill">Score: <span id="liveScore">0</span></span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

    <div class="q-card">
      <span class="q-week-tag" id="qWeekTag">Week 1</span>
      <div class="q-text" id="qText"></div>
      <div class="options" id="options"></div>
      <div class="explain hidden" id="explain"></div>
      <div class="next-row hidden" id="nextRow">
        <button class="btn btn-pink" id="nextBtn">Next Question →</button>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div id="results" class="hidden">
    <div class="panel" style="margin-bottom:30px;">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <div class="big-score" id="finalScore">0 / 10</div>
      <p class="result-msg" id="resultMsg"></p>
      <div class="result-btns">
        <a class="btn btn-pink" id="retryBtn" href="#">Retry This Week</a>
        <a class="btn btn-outline" href="index.html#weeks">Pick Another Week</a>
        <a class="btn btn-outline" href="progress.html">My Progress</a>
      </div>
    </div>
    <div class="review">
      <h3>Review Your Answers</h3>
      <div id="reviewList"></div>
    </div>
  </div>

</main>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  let week = parseInt(params.get('week'), 10);

  const $ = id => document.getElementById(id);
  const loading = $('loading'), errorBox = $('error'), picker = $('picker'),
        quiz = $('quiz'), results = $('results');

  // No valid week in URL -> show picker
  if (!week || week < 1 || week > 12) {
    loading.classList.add('hidden');
    picker.classList.remove('hidden');
    const grid = $('weekPickGrid');
    for (let w = 1; w <= 12; w++) {
      const b = document.createElement('button');
      b.className = 'week-pick';
      b.textContent = 'Week ' + w;
      b.onclick = () => { location.href = 'practice.html?week=' + w; };
      grid.appendChild(b);
    }
    return;
  }

  let questions = [], index = 0, score = 0, answered = false;
  const wrongAnswers = [];
  const LETTERS = ['A', 'B', 'C', 'D'];

  function initQuiz(qs) {
    loading.classList.add('hidden');
    if (!qs || !qs.length) {
      $('errorMsg').textContent = 'No questions found for week ' + week + '.';
      errorBox.classList.remove('hidden');
      return;
    }
    questions = shuffle(qs);
    $('qWeekTag').textContent = 'Week ' + week;
    $('retryBtn').href = 'practice.html?week=' + week;
    quiz.classList.remove('hidden');
    renderQuestion();
  }

  // Dual-mode loading: questions-data.js -> questions.json -> api.php
  if (window.NPTEL_QUESTIONS && window.NPTEL_QUESTIONS[week]) {
    initQuiz(window.NPTEL_QUESTIONS[week]);
  } else {
    fetch('questions.json')
      .then(r => r.json())
      .then(data => {
        if (data && data[week]) {
          initQuiz(data[week]);
        } else {
          throw new Error('Week not in questions.json');
        }
      })
      .catch(() => {
        // Fallback to PHP API if running locally on a PHP server
        fetch('api.php?week=' + week)
          .then(r => r.json())
          .then(data => {
            if (data.error || !data.questions) throw new Error(data.error || 'Failed');
            initQuiz(data.questions);
          })
          .catch(() => {
            loading.classList.add('hidden');
            $('errorMsg').textContent = 'Could not load questions for Week ' + week + '. Check questions-data.js or server status.';
            errorBox.classList.remove('hidden');
          });
      });
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- Render one question ----------
  function renderQuestion() {
    answered = false;
    const q = questions[index];

    $('qCount').textContent = `Question ${index + 1} of ${questions.length}`;
    $('liveScore').textContent = score;
    $('progressBar').style.width = ((index) / questions.length * 100) + '%';

    $('qText').textContent = q.question;
    $('explain').classList.add('hidden');
    $('nextRow').classList.add('hidden');

    const box = $('options');
    box.innerHTML = '';
    // Shuffle options too, tracking where the correct one lands
    const opts = shuffle([
      { letter: 'A', text: q.option_a },
      { letter: 'B', text: q.option_b },
      { letter: 'C', text: q.option_c },
      { letter: 'D', text: q.option_d },
    ]);

    opts.forEach(o => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.innerHTML = `<span class="opt-letter">${o.letter}</span><span>${escapeHtml(o.text)}</span>`;
      btn.onclick = () => answer(btn, o, q);
      box.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ---------- Answer handling ----------
  function answer(btn, chosen, q) {
    if (answered) return;
    answered = true;

    const allBtns = Array.from($('options').children);
    allBtns.forEach(b => b.disabled = true);

    const correctLetter = q.correct_option;
    const isCorrect = chosen.letter === correctLetter;

    if (isCorrect) {
      score++;
      btn.classList.add('correct');
    } else {
      btn.classList.add('wrong');
      // highlight the correct one
      allBtns.forEach((b, i) => {
        if ($('options').children[i] === b) { /* noop */ }
      });
      allBtns.forEach(b => {
        const l = b.querySelector('.opt-letter').textContent;
        if (l === correctLetter) b.classList.add('correct');
        else if (b !== btn) b.classList.add('dim');
      });
      wrongAnswers.push({ q, chosen: chosen.letter });
    }
    if (isCorrect) {
      allBtns.forEach(b => { if (b !== btn) b.classList.add('dim'); });
    }

    $('liveScore').textContent = score;
    $('progressBar').style.width = ((index + 1) / questions.length * 100) + '%';

    const ex = $('explain');
    ex.innerHTML = `<strong>${isCorrect ? '✅ Correct!' : '❌ Not quite.'}</strong> ` +
      `The right answer is <strong>${correctLetter}</strong>. ` + escapeHtml(q.explanation || 'No explanation provided.');
    ex.classList.remove('hidden');

    const nextBtn = $('nextBtn');
    nextBtn.textContent = index + 1 === questions.length ? 'See Results 🎉' : 'Next Question →';
    $('nextRow').classList.remove('hidden');
    nextBtn.onclick = () => {
      index++;
      if (index < questions.length) renderQuestion();
      else showResults();
    };
  }

  // ---------- Results ----------
  function showResults() {
    quiz.classList.add('hidden');
    results.classList.remove('hidden');
    $('progressBar').style.width = '100%';

    $('finalScore').textContent = `${score} / ${questions.length}`;

    const pct = score / questions.length;
    let emoji, msg;
    if (pct === 1)      { emoji = '🏆'; msg = 'Perfect score! You nailed every single question!'; }
    else if (pct >= .8) { emoji = '🌟'; msg = 'Great job! You really know this week.'; }
    else if (pct >= .5) { emoji = '💪'; msg = 'Good effort — review the misses below and try again!'; }
    else                { emoji = '📚'; msg = 'Keep practising — the explanations below will help!'; }
    $('resultEmoji').textContent = emoji;
    $('resultMsg').textContent = msg;

    // Review list
    const list = $('reviewList');
    list.innerHTML = '';
    if (wrongAnswers.length === 0) {
      list.innerHTML = '<div class="review-empty">Nothing to review — zero mistakes! 🎉</div>';
    } else {
      wrongAnswers.forEach(({ q, chosen }) => {
        const div = document.createElement('div');
        div.className = 'review-item';
        div.innerHTML =
          `<div class="rv-q">${escapeHtml(q.question)}</div>` +
          `<div class="rv-line rv-wrong">✗ Your answer: ${chosen} — ${escapeHtml(q['option_' + chosen.toLowerCase()])}</div>` +
          `<div class="rv-line rv-right">✓ Correct answer: ${q.correct_option} — ${escapeHtml(q['option_' + q.correct_option.toLowerCase()])}</div>` +
          (q.explanation ? `<div class="rv-line" style="color:#8a7a9b;font-weight:600;">💡 ${escapeHtml(q.explanation)}</div>` : '');
        list.appendChild(div);
      });
    }

    // Save attempt (dual-mode: localStorage + MySQL via api.php)
    try {
      const STORAGE_KEY = 'nptel_mcq_attempts_v1';
      const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const now = new Date();
      const dateStr = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0') + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0');
      history.unshift({
        id: Date.now(),
        week_number: week,
        score: score,
        total: questions.length,
        taken_at: dateStr
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 100)));
    } catch (e) {
      console.warn('Could not save to localStorage', e);
    }

    // Attempt backend save if running on PHP server
    const body = new URLSearchParams({ week, score, total: questions.length });
    fetch('api.php?action=save', { method: 'POST', body })
      .catch(() => { /* silent fallback on static hosting */ });

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
})();
</script>

</body>
</html>
